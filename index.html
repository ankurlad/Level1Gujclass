<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <!-- No maximum-scale / user-scalable=no: blocking pinch-zoom is a WCAG 1.4.4
         (Resize Text) failure. viewport-fit=cover stays for the safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The tracing guide glyph cannot render until this font is in; preload it. -->
    <link rel="preload" href="/fonts/noto-sans-gujarati-gujarati.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="PWA for Kids to Learn and Trace Gujarati Alphabets" />
    <title>Akshar Gujarati Learner PWA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
