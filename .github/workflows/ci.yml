name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR supersedes the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 requires ^22.14.0 || >=24.0.0.
          node-version: 22.x
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test
